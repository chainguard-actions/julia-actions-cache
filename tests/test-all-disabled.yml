name: Test all cache directories disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: cache
        uses: .
        with:
          cache-name: julia-cache-test-all-disabled
          cache-artifacts: 'false'
          cache-packages: 'false'
          cache-registries: 'false'
          cache-compiled: 'false'
          cache-scratchspaces: 'false'
          cache-logs: 'false'
          delete-old-caches: 'false'
      - name: Assert cache-key is non-empty
        env:
          CACHE_KEY: ${{ steps.cache.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: cache-key output is empty"
            exit 1
          fi
          echo "PASS: cache-key is non-empty"
      - name: Assert no positive cache paths when all disabled
        env:
          CACHE_PATHS: ${{ steps.cache.outputs.cache-paths }}
        run: |
          echo "cache-paths: '$CACHE_PATHS'"
          # When all cache directories are disabled, cache-paths should only contain
          # exclusion patterns (lines starting with !) and no positive paths.
          # Filter out exclusion patterns (lines starting with !) and check remaining lines.
          POSITIVE_PATHS=$(echo "$CACHE_PATHS" | grep -v '^!' || true)
          echo "positive paths: '$POSITIVE_PATHS'"
          # Remove whitespace
          POSITIVE_NORM=$(echo "$POSITIVE_PATHS" | tr -d '[:space:]')
          if [ -n "$POSITIVE_NORM" ]; then
            echo "FAIL: cache-paths should have no positive paths when all cache directories are disabled, got: $POSITIVE_PATHS"
            exit 1
          fi
          echo "PASS: no positive cache paths when all disabled (only exclusion patterns remain)"
