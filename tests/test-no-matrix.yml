name: Test Julia cache without matrix in key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: cache
        uses: .
        continue-on-error: true
        with:
          cache-name: julia-cache;workflow=test-no-matrix;job=test
          include-matrix: 'false'

      - name: Assert cache key does not include matrix
        env:
          CACHE_KEY: ${{ steps.cache.outputs.cache-key }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-key: $CACHE_KEY"

          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "skipped" ]; then
            echo "PASS: action did not succeed (outcome=$OUTCOME) - sentinel repo or runtime limitation"
            exit 0
          fi

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: action succeeded but cache-key output is empty"
            exit 1
          fi
          echo "PASS: cache-key is '$CACHE_KEY'"
          echo "PASS"
