name: Test cache without matrix
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: cache
        uses: .
        with:
          cache-name: julia-cache;workflow=test;job=no-matrix
          include-matrix: 'false'
          delete-old-caches: 'false'

      - name: Assert cache-key is set
        env:
          CACHE_KEY: ${{ steps.cache.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: cache-key output is empty"
            exit 1
          fi
          echo "PASS: cache-key is set"

      - name: Assert cache-paths is set
        env:
          CACHE_PATHS: ${{ steps.cache.outputs.cache-paths }}
        run: |
          echo "cache-paths: $CACHE_PATHS"
          if [ -z "$CACHE_PATHS" ]; then
            echo "FAIL: cache-paths output is empty"
            exit 1
          fi
          echo "PASS: cache-paths is set"

      - name: Assert cache-key does not contain matrix values
        env:
          CACHE_KEY: ${{ steps.cache.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          # When include-matrix is false and matrix is null/empty,
          # the key should not contain "null" from matrix JSON
          # (it may contain "null" if matrix is included, but here it should not)
          echo "PASS: cache-key generated without matrix"
