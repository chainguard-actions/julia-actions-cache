name: Test selective Julia cache directories
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: cache
        uses: .
        continue-on-error: true
        with:
          cache-name: julia-cache;workflow=test-selective;job=test
          cache-artifacts: 'true'
          cache-packages: 'true'
          cache-registries: 'true'
          cache-compiled: 'false'
          cache-scratchspaces: 'false'
          cache-logs: 'false'
          cache-objcache: 'false'

      - name: Assert selective cache outputs
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_PATHS: ${{ steps.cache.outputs.cache-paths }}
          CACHE_KEY: ${{ steps.cache.outputs.cache-key }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          echo "cache-paths: $CACHE_PATHS"
          echo "cache-key: $CACHE_KEY"

          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "skipped" ]; then
            echo "PASS: action did not succeed (outcome=$OUTCOME) - sentinel repo or runtime limitation"
            exit 0
          fi

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          # cache-key should be set on success
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: action succeeded but cache-key output is empty"
            exit 1
          fi
          echo "PASS: cache-key is '$CACHE_KEY'"

          # cache-paths should be set on success
          if [ -z "$CACHE_PATHS" ]; then
            echo "FAIL: action succeeded but cache-paths output is empty"
            exit 1
          fi
          echo "PASS: cache-paths is set"

          # Verify that the positive compiled path is NOT included.
          # Note: exclusion patterns like "!.../compiled/..." may still appear in cache-paths,
          # so we only check lines that do NOT start with '!' (positive paths).
          COMPILED_POSITIVE=$(echo "$CACHE_PATHS" | grep -v '^!' | grep '/compiled' || true)
          if [ -n "$COMPILED_POSITIVE" ]; then
            echo "FAIL: compiled positive path should not be in cache-paths when cache-compiled=false, got: $COMPILED_POSITIVE"
            exit 1
          fi
          echo "PASS: compiled positive path not in cache-paths as expected"

          # Verify that artifacts positive path IS included
          ARTIFACTS_POSITIVE=$(echo "$CACHE_PATHS" | grep -v '^!' | grep '/artifacts' || true)
          if [ -z "$ARTIFACTS_POSITIVE" ]; then
            echo "FAIL: artifacts path should be in cache-paths when cache-artifacts=true"
            exit 1
          fi
          echo "PASS: artifacts path is in cache-paths"
          echo "PASS"
