name: Test custom depot path
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom depot directory
        run: mkdir -p "$GITHUB_WORKSPACE/my-julia-depot"

      - id: cache
        uses: .
        with:
          cache-name: julia-cache;workflow=test;job=custom-depot
          depot: "${{ github.workspace }}/my-julia-depot"
          delete-old-caches: 'false'

      - name: Assert cache-key is set
        env:
          CACHE_KEY: ${{ steps.cache.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: cache-key output is empty"
            exit 1
          fi
          echo "PASS: cache-key is set"

      - name: Assert cache-paths contains custom depot
        env:
          CACHE_PATHS: ${{ steps.cache.outputs.cache-paths }}
        run: |
          echo "cache-paths: $CACHE_PATHS"
          if [ -z "$CACHE_PATHS" ]; then
            echo "FAIL: cache-paths output is empty"
            exit 1
          fi
          if ! echo "$CACHE_PATHS" | grep -q "my-julia-depot"; then
            echo "FAIL: custom depot path not found in cache-paths: $CACHE_PATHS"
            exit 1
          fi
          echo "PASS: custom depot path found in cache-paths"
