name: Test basic usage with default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          cache-name: julia-cache-test-basic
          delete-old-caches: 'false'

      - name: Assert cache-key output is set
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: cache-key output is empty"
            exit 1
          fi
          echo "PASS: cache-key is set"

      - name: Assert cache-paths output is set
        env:
          CACHE_PATHS: ${{ steps.action.outputs.cache-paths }}
        run: |
          echo "cache-paths: $CACHE_PATHS"
          if [ -z "$CACHE_PATHS" ]; then
            echo "FAIL: cache-paths output is empty"
            exit 1
          fi
          echo "PASS: cache-paths is set"

      - name: Assert cache-key contains expected prefix
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if ! echo "$CACHE_KEY" | grep -q "julia-cache-test-basic"; then
            echo "FAIL: cache-key does not contain expected prefix 'julia-cache-test-basic'"
            exit 1
          fi
          echo "PASS: cache-key contains expected prefix"

      - name: Assert cache-key contains OS
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if ! echo "$CACHE_KEY" | grep -qi "os=Linux"; then
            echo "FAIL: cache-key does not contain os=Linux"
            exit 1
          fi
          echo "PASS: cache-key contains OS"

      - name: Assert cache-paths includes default julia depot subdirs
        env:
          CACHE_PATHS: ${{ steps.action.outputs.cache-paths }}
        run: |
          echo "cache-paths: $CACHE_PATHS"
          for subdir in artifacts packages compiled scratchspaces logs; do
            if ! echo "$CACHE_PATHS" | grep -q "$subdir"; then
              echo "FAIL: cache-paths does not contain '$subdir'"
              exit 1
            fi
          done
          echo "PASS: cache-paths contains all expected subdirectories"
