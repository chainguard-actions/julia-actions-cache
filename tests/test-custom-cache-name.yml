name: Test custom cache-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          cache-name: my-custom-julia-cache
      - name: Assert cache-key contains custom name or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-key: $CACHE_KEY"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CACHE_KEY" ]; then
              echo "FAIL: action succeeded but cache-key output is empty"
              exit 1
            fi
            if echo "$CACHE_KEY" | grep -q "my-custom-julia-cache"; then
              echo "PASS: cache-key contains custom cache-name"
            else
              echo "FAIL: cache-key '$CACHE_KEY' does not contain 'my-custom-julia-cache'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no cache service)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
