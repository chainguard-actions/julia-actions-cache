name: Test custom cache-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Node.js 24
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
      - id: cache
        uses: .
        with:
          cache-name: my-custom-julia-cache
          include-matrix: 'false'
          delete-old-caches: 'false'
      - name: Assert cache-key contains custom cache-name prefix
        env:
          CACHE_KEY: ${{ steps.cache.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: cache-key output is empty"
            exit 1
          fi
          if ! echo "$CACHE_KEY" | grep -q "my-custom-julia-cache"; then
            echo "FAIL: cache-key does not contain custom cache-name 'my-custom-julia-cache'"
            exit 1
          fi
          echo "PASS: cache-key contains custom cache-name"
      - name: Assert cache-paths is non-empty
        env:
          CACHE_PATHS: ${{ steps.cache.outputs.cache-paths }}
        run: |
          echo "cache-paths: $CACHE_PATHS"
          if [ -z "$CACHE_PATHS" ]; then
            echo "FAIL: cache-paths output is empty"
            exit 1
          fi
          echo "PASS: cache-paths is non-empty"
