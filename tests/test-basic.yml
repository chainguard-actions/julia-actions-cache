name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-name: julia-cache-test-basic
      - name: Assert cache-key is set
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: cache-key output is empty"
            exit 1
          fi
          echo "PASS: cache-key is set"
      - name: Assert cache-key contains cache-name prefix
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if ! echo "$CACHE_KEY" | grep -q "julia-cache-test-basic"; then
            echo "FAIL: cache-key does not contain the cache-name prefix"
            exit 1
          fi
          echo "PASS: cache-key contains cache-name prefix"
      - name: Assert cache-key contains OS
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if ! echo "$CACHE_KEY" | grep -q "os=Linux"; then
            echo "FAIL: cache-key does not contain os=Linux"
            exit 1
          fi
          echo "PASS: cache-key contains OS"
      - name: Assert cache-paths is set
        env:
          CACHE_PATHS: ${{ steps.action.outputs.cache-paths }}
        run: |
          echo "cache-paths: $CACHE_PATHS"
          if [ -z "$CACHE_PATHS" ]; then
            echo "FAIL: cache-paths output is empty"
            exit 1
          fi
          echo "PASS: cache-paths is set"
      - name: Assert cache-paths contains default julia directories
        env:
          CACHE_PATHS: ${{ steps.action.outputs.cache-paths }}
        run: |
          echo "cache-paths: $CACHE_PATHS"
          for dir in artifacts packages compiled scratchspaces logs; do
            if ! echo "$CACHE_PATHS" | grep -q "$dir"; then
              echo "FAIL: cache-paths does not contain '$dir'"
              exit 1
            fi
          done
          echo "PASS: cache-paths contains all expected directories"
      - name: Assert depot directory was created
        run: |
          DEPOT="$HOME/.julia"
          echo "Checking depot: $DEPOT"
          if [ ! -d "$DEPOT" ]; then
            echo "FAIL: depot directory was not created at $DEPOT"
            exit 1
          fi
          echo "PASS: depot directory exists"
