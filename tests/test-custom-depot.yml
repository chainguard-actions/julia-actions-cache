name: Test Julia cache with custom depot path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom depot directory
        run: |
          mkdir -p /tmp/julia-depot/artifacts
          mkdir -p /tmp/julia-depot/packages
          mkdir -p /tmp/julia-depot/registries

      - id: cache
        uses: .
        continue-on-error: true
        with:
          cache-name: julia-cache;workflow=test-custom-depot;job=test
          depot: '/tmp/julia-depot'

      - name: Assert cache used custom depot
        env:
          CACHE_PATHS: ${{ steps.cache.outputs.cache-paths }}
          CACHE_KEY: ${{ steps.cache.outputs.cache-key }}
          OUTCOME: ${{ steps.cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-paths: $CACHE_PATHS"
          echo "cache-key: $CACHE_KEY"

          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "skipped" ]; then
            echo "PASS: action did not succeed (outcome=$OUTCOME) - sentinel repo or runtime limitation"
            exit 0
          fi

          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: action succeeded but cache-key output is empty"
            exit 1
          fi
          echo "PASS: cache-key is '$CACHE_KEY'"

          # Verify cache-paths references the custom depot
          if [ -z "$CACHE_PATHS" ]; then
            echo "FAIL: action succeeded but cache-paths output is empty"
            exit 1
          fi

          if ! echo "$CACHE_PATHS" | grep -q "julia-depot"; then
            echo "FAIL: cache-paths '$CACHE_PATHS' does not reference custom depot '/tmp/julia-depot'"
            exit 1
          fi
          echo "PASS: cache-paths references custom depot"
          echo "PASS"
