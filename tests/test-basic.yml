name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
          CACHE_PATHS: ${{ steps.action.outputs.cache-paths }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-key: $CACHE_KEY"
          echo "cache-paths: $CACHE_PATHS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CACHE_KEY" ]; then
              echo "FAIL: action succeeded but cache-key output is empty"
              exit 1
            fi
            echo "PASS: cache-key='$CACHE_KEY'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no cache service)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
