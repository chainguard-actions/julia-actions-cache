name: Test cache key format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-name: my-custom-prefix
          depot: /tmp/julia-depot-keyformat
          include-matrix: 'false'
      - name: Assert cache-key contains run_id
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if ! echo "$CACHE_KEY" | grep -q "run_id="; then
            echo "FAIL: cache-key does not contain 'run_id='"
            exit 1
          fi
          echo "PASS: cache-key contains run_id"
      - name: Assert cache-key contains run_attempt
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if ! echo "$CACHE_KEY" | grep -q "run_attempt="; then
            echo "FAIL: cache-key does not contain 'run_attempt='"
            exit 1
          fi
          echo "PASS: cache-key contains run_attempt"
      - name: Assert cache-key starts with custom prefix
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if ! echo "$CACHE_KEY" | grep -q "^my-custom-prefix"; then
            echo "FAIL: cache-key does not start with 'my-custom-prefix'"
            exit 1
          fi
          echo "PASS: cache-key starts with custom prefix"
      - name: Assert cache-key does not contain matrix segment when include-matrix is false
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          # When include-matrix=false and no matrix is set, there should be no extra matrix segment
          # The key format should be: prefix;os=OS;run_id=X;run_attempt=Y
          # Verify the key is well-formed (contains os= and run_id=)
          if ! echo "$CACHE_KEY" | grep -qE "os=.+;run_id="; then
            echo "FAIL: cache-key does not match expected format 'os=...;run_id=...'"
            exit 1
          fi
          echo "PASS: cache-key has expected format"
