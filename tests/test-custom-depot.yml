name: Test custom depot path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom depot directory
        run: mkdir -p /tmp/julia-depot
      - id: action
        uses: .
        continue-on-error: true
        with:
          cache-name: julia-cache;workflow=test;job=custom-depot
          depot: /tmp/julia-depot
      - name: Assert cache-key output is set
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: cache-key output is empty"
            exit 1
          fi
          echo "PASS: cache-key is set"
      - name: Assert cache-paths output is set
        env:
          CACHE_PATHS: ${{ steps.action.outputs.cache-paths }}
        run: |
          echo "cache-paths: $CACHE_PATHS"
          if [ -z "$CACHE_PATHS" ]; then
            echo "FAIL: cache-paths output is empty"
            exit 1
          fi
          echo "PASS: cache-paths is set"
      - name: Assert cache-paths includes custom depot
        env:
          CACHE_PATHS: ${{ steps.action.outputs.cache-paths }}
        run: |
          echo "cache-paths: $CACHE_PATHS"
          if ! echo "$CACHE_PATHS" | grep -q "/tmp/julia-depot"; then
            echo "FAIL: cache-paths should include the custom depot path /tmp/julia-depot"
            exit 1
          fi
          echo "PASS: custom depot path found in cache-paths"
